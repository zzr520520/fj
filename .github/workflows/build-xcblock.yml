name: Build XCBlock Dylib

on:
  push:
    branches: [ main ]
    paths:
      - 'xcblock/**'
      - '.github/workflows/build-xcblock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plain dylib (no CydiaSubstrate dependency)
        run: |
          mkdir -p out
          xcrun -sdk iphoneos clang \
            -arch arm64 -arch arm64e \
            -dynamiclib -fobjc-arc \
            -miphoneos-version-min=14.0 \
            -install_name "@executable_path/XCNoAdJump.dylib" \
            -framework UIKit -framework Foundation \
            -o out/XCNoAdJump.dylib xcblock/Tweak.xm
          xcrun codesign --force --sign - out/XCNoAdJump.dylib || true

      - name: Verify dependencies
        run: |
          xcrun otool -L out/XCNoAdJump.dylib
          xcrun otool -l out/XCNoAdJump.dylib | grep -A4 LC_LOAD || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: xcblock-dylib
          path: out/XCNoAdJump.dylib
          if-no-files-found: error
