name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要历史版本用来还原被富文本破坏的方法符号（- / +）
          fetch-depth: 0

      - name: Normalize source filename
        run: |
          # Makefile 固定引用 Tweak.xm；上传的源文件可能叫别的名字或后缀（.m/.mm/.x）。
          # 这里统一改名为 Tweak.xm（Logos 对纯 ObjC 文件也兼容）。
          echo "--- before ---"
          ls -la
          shopt -s nullglob
          target=""
          for f in Tweak.xm tweak.xm *.xm *.x *.mm *.m; do
            if [ -f "$f" ]; then target="$f"; break; fi
          done
          if [ -n "$target" ] && [ "$target" != "Tweak.xm" ]; then
            mv -- "$target" Tweak.xm
            echo "renamed '$target' -> 'Tweak.xm'"
          fi
          echo "--- after ---"
          ls -la Tweak.xm

      - name: Repair Markdown-mangled source
        run: |
          # 代码若从富文本/Markdown 视图复制，会出现系统性损坏（幂等修复）：
          #  1) 行首的 "- " / "+ " 被渲染成列表圆点 -> U+FFFC 字符，导致方法声明非法
          #     （进而报 "%orig does not make sense outside a method"）。
          #     这里用 git 历史里同名方法的符号还原；查不到的按实例方法 "-" 处理。
          #  2) 部分 "*" 丢失，导致 "String (NSDictionary )foo"、"NSString kw ="、
          #     "((id ()(id, SEL))objc_msgSend)" 等非法写法。
          #  3) 字符串里的 \" 被去掉反斜杠，导致引号错配。
          python3 - <<'PY'
          import re, pathlib, subprocess

          p = pathlib.Path("Tweak.xm")
          s = p.read_text()

          # ---- 1) 用 git 历史推断每个 selector 的正确符号 ----
          sig2sign = {}
          try:
              revs = subprocess.run(
                  ["git", "log", "--format=%H", "-50", "--", "Tweak.xm", "Tweak.x", "tweak.xm"],
                  capture_output=True, text=True).stdout.split()
              for rev in revs:
                  for name in ("Tweak.xm", "Tweak.x", "tweak.xm"):
                      r = subprocess.run(["git", "show", "%s:%s" % (rev, name)],
                                         capture_output=True, text=True)
                      if r.returncode != 0:
                          continue
                      for ln in r.stdout.split("\n"):
                          m = re.match(r'^[ \t]*([\-\+])\s*\(([^)]*)\)\s*([A-Za-z_]\w*)', ln)
                          if m:
                              sig2sign.setdefault(m.group(3), m.group(1))
          except Exception as e:
              print("history lookup failed:", e)

          CLASS_METHODS = {"shared", "defaultManager", "standardUserDefaults",
                           "currentUser", "fromDict", "alloc", "new", "class", "instance"}

          def fix_fffc(m):
              indent, rest = m.group(1), m.group(2)
              sm = re.match(r'([^)]*?)\)\s*([A-Za-z_]\w*)?', rest)
              sel = sm.group(2) if (sm and sm.group(2)) else ""
              sign = sig2sign.get(sel) or ("+" if sel in CLASS_METHODS else "-")
              return "%s%s (%s" % (indent, sign, rest)

          s, n_fffc = re.subn(r'(?m)^([ \t]*)\ufffc[ \t]*\((.*)$', fix_fffc, s)

          # ---- 2) 还原被吞掉的 "*" ----
          classes = set(re.findall(r'@interface\s+(\w+)', s)) | {
              "NSString", "NSArray", "NSMutableArray", "NSDictionary", "NSMutableDictionary",
              "NSData", "NSMutableData", "NSNumber", "NSError", "NSURL", "NSURLRequest",
              "NSURLResponse", "NSURLSession", "NSURLSessionDataTask", "NSURLSessionTask",
              "UIImage", "UIView", "UILabel", "UIButton", "UITableView", "UITableViewCell",
              "UICollectionView", "UIViewController", "UISwitch", "UITextField", "UITextView",
              "UISegmentedControl", "UIColor", "UIWindow", "UIFont", "NSAttributedString",
              "NSDate", "NSTimer", "NSObject", "NSMutableString", "NSIndexPath",
          }
          n_star = 0
          def sub(pat, fn):
              global s, n_star
              s, k = re.subn(pat, fn, s)
              n_star += k
          # (Type )            -> (Type *)
          sub(r'\(([A-Za-z_]\w*) \)', lambda m: '(%s *)' % m.group(1) if m.group(1) in classes else m.group(0))
          # ((Type ()(args))   -> ((Type (*)(args))
          sub(r'\(\(([A-Za-z_]\w*) \(\)\(',
              lambda m: '((%s (*)(' % m.group(1) if (m.group(1) in classes or m.group(1) in ("id", "void")) else m.group(0))
          # (Type name) / , Type name)  -> Type *name
          sub(r'(?<![\w*])([A-Za-z_]\w*) ([A-Za-z_]\w*)(?=\s*[,)])',
              lambda m: ' %s *%s' % (m.group(1), m.group(2)) if m.group(1) in classes else m.group(0))
          # 行首局部变量声明: Type name =
          sub(r'(?m)^([ \t]*)([A-Za-z_]\w*) ([A-Za-z_]\w*) =',
              lambda m: m.group(1) + m.group(2) + ' *' + m.group(3) + ' ='
                        if (m.group(2) in classes and m.group(3) not in ("alloc", "init")) else m.group(0))

          # ---- 3) 还原被去掉反斜杠的转义引号 ----
          s = s.replace('@"SELECT * FROM "%@" LIMIT 10000;"',
                        '@"SELECT * FROM \\"%@\\" LIMIT 10000;"')

          if n_fffc or n_star:
              p.write_text(s)
          print("repaired leading U+FFFC:", n_fffc, "| restored '*':", n_star)
          PY

      - name: Fix Swift 'String' type leaks
        run: |
          # 混入 Swift 类型名 String 会报 unknown type name 'String'，统一改成 NSString。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'(?<![A-Za-z_])String(?=[ \t]*\*)', 'NSString', s)
          if n:
              p.write_text(new)
          print("fixed", n, "Swift String type leak(s)")
          PY

      - name: Fix kUTType constants
        run: |
          # 新版 iOS SDK 里 kUTType* 常量可能已不可用，统一替换为等价的 UTI 字符串。
          python3 - <<'PY'
          import re, pathlib
          uti = {
              "kUTTypeItem": "public.item", "kUTTypeContent": "public.content",
              "kUTTypeData": "public.data", "kUTTypeDirectory": "public.directory",
              "kUTTypeFolder": "public.folder", "kUTTypeImage": "public.image",
              "kUTTypeMovie": "public.movie", "kUTTypeVideo": "public.video",
              "kUTTypeAudio": "public.audio", "kUTTypeText": "public.text",
              "kUTTypePlainText": "public.plain-text", "kUTTypeUTF8PlainText": "public.utf8-plain-text",
              "kUTTypeHTML": "public.html", "kUTTypeXML": "public.xml", "kUTTypeJSON": "public.json",
              "kUTTypeURL": "public.url", "kUTTypeFileURL": "public.file-url",
              "kUTTypePDF": "com.adobe.pdf", "kUTTypeJPEG": "public.jpeg",
              "kUTTypePNG": "public.png", "kUTTypeGIF": "com.compuserve.gif",
              "kUTTypeRTF": "public.rtf", "kUTTypeMPEG4": "public.mpeg-4",
              "kUTTypeQuickTimeMovie": "com.apple.quicktime-movie",
          }
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          count = 0
          # 先处理 "(NSString *)kUTTypeXxx" 这种带转换的写法
          for name in sorted(uti, key=len, reverse=True):
              s, n1 = re.subn(r'\(\s*NSString\s*\*+\s*\)\s*%s\b' % name, '"%s"' % uti[name], s)
              s, n2 = re.subn(r'\b%s\b' % name, '"%s"' % uti[name], s)
              count += n1 + n2
          if count:
              p.write_text(s)
          print("replaced", count, "kUTType constant(s)")
          PY

      - name: Strip block nullability annotations in hook signatures
        run: |
          # Logos 解析不了块参数类型里紧跟 ^ 的 _Nonnull/_Nullable，
          # 会导致参数名丢失并报 "use of undeclared identifier <param>"，删掉这些标注即可。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'(\^)\s*_(?:Nonnull|Nullable|Null_unspecified)\b', r'\1', s)
          if n:
              p.write_text(new)
          print("stripped", n, "nullability annotation(s) after '^'")
          PY

      - name: Fix void* to function pointer casts
        run: |
          # 形如 "X = (void *)method_getImplementation(...)" 或
          # "X = (void *)SafeSwizzleInstanceMethod(...)" 在 ObjC++ 下是错误：
          # void* 不能直接赋给函数指针。此处通用改写为目标变量自身的类型（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(r'([A-Za-z_]\w*)\s*=\s*\(void \*\)(\w+\()',
                           r'\1 = (__typeof__(\1))\2', s)
          if n:
              p.write_text(new)
          print("rewrote", n)
          PY

      - name: Fix __bridge void* to typed C pointer casts
        run: |
          # ARC 下 "uint8_t *base = (__bridge void *)obj;" 需显式补上目标类型转换（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(
              r'(?m)^([ \t]*)([A-Za-z_]\w*(?:[ \t]*\*)+)[ \t]*([A-Za-z_]\w*)[ \t]*=[ \t]*\(__bridge void \*\)',
              r'\1\2\3 = (\2)(__bridge void *)', s)
          if n:
              p.write_text(new)
          print("fixed", n, "bridge-void cast(s)")
          PY

      - name: Fix ARC strong/unsafe_unretained pointer casts
        run: |
          # ARC 下 "*(id __unsafe_unretained *)(uint8_t *...)" 或 "*(id __strong *)(...)"
          # 会报 "cast of a non-Objective-C pointer type 'uint8_t *' to '... id *' is
          #  disallowed with ARC"。在转换前插入中间 (void *) 转换即可合法（幂等）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()
          new, n = re.subn(
              r'\(\s*([A-Za-z_]\w*(?:\s*\*)?)\s*__(strong|unsafe_unretained)\s*\*\)\s*(?!\(void \*\))\((?!(?:void|id|NSString|NSObject|Class)\b)',
              r'(\1 __\2 *)(void *)(', s)
          if n:
              p.write_text(new)
          print("wrapped", n, "ARC pointer cast(s)")
          PY

      - name: Install Theos and iOS SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls -1 "$THEOS/sdks"

      - name: Install ldid / dpkg
        run: |
          brew install ldid dpkg || brew install ldid || true
          which ldid || true
          which dpkg-deb || true

      - name: Ensure missing self.xxx properties are declared
        run: |
          # 源码里用了 self.xxx 却没有声明该属性时，会报
          # "property 'xxx' not found on object of type 'YYY *'"。
          # 这里按名字后缀推断类型（Label/Switch/Button/Bar/View/...），
          # 在对应 @implementation 之前插入一个分类声明（幂等，已声明的会跳过）。
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("Tweak.xm")
          s = p.read_text()

          declared = set(re.findall(r'@property\s*\([^)]*\)[^;]*?\b(\w+)\s*;', s))
          methods = set(re.findall(r'^[ \t]*[-+]\s*\([^)]*\)\s*(\w+)', s, re.M))
          methods |= set(re.findall(r'@selector\(\s*(\w+)', s))

          suffix = [('SegmentedControl', 'UISegmentedControl'), ('SegmentControl', 'UISegmentedControl'),
                    ('TableView', 'UITableView'), ('TextView', 'UITextView'), ('ImageView', 'UIImageView'),
                    ('Label', 'UILabel'), ('Switch', 'UISwitch'), ('Button', 'UIButton'),
                    ('Btn', 'UIButton'), ('Field', 'UITextField'), ('Bar', 'UIView'),
                    ('View', 'UIView'), ('Segment', 'UISegmentedControl')]

          def ty(name):
              for suf, t in suffix:
                  if name.endswith(suf):
                      return t
              return None

          lines = s.split("\n")

          def enclosing_impl(k):
              for t in range(k, -1, -1):
                  m = re.match(r'^@implementation\s+([A-Za-z_]\w*)', lines[t])
                  if m:
                      return m.group(1)
              return None

          need = {}
          for i, ln in enumerate(lines):
              for m in re.finditer(r'self\.(\w+)', ln):
                  n = m.group(1)
                  if n in declared or n in methods:
                      continue
                  t = ty(n)
                  if not t:
                      continue
                  cls = enclosing_impl(i)
                  if cls:
                      need.setdefault(cls, set()).add((n, t))

          added = []
          if need:
              out, i = [], 0
              while i < len(lines):
                  mm = re.match(r'^@implementation\s+([A-Za-z_]\w*)', lines[i])
                  if mm and mm.group(1) in need:
                      out.append("@interface %s (HOAutoProps)" % mm.group(1))
                      for n, t in sorted(need[mm.group(1)]):
                          out.append("@property (nonatomic, strong) %s *%s;" % (t, n))
                          added.append(n)
                      out.append("@end")
                  out.append(lines[i])
                  i += 1
              p.write_text("\n".join(out))
          print("added property declaration(s):", added)
          PY

      - name: Build dylib
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Package deb
        run: make package FINALPACKAGE=1

      - name: Inspect build output
        if: always()
        run: |
          find .theos/obj -name '*.dylib' -exec file {} \; || true
          ls -l packages/ || true

      - name: Upload dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fj-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fj-deb
          path: packages/*.deb
          if-no-files-found: ignore
