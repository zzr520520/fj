name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls -1 "$THEOS/sdks"

      - name: Install ldid / dpkg
        run: |
          brew install ldid dpkg || brew install ldid || true
          which ldid || true
          which dpkg-deb || true

      - name: Ensure ACContactItem.isGroup declaration
        run: |
          # Tweak.xm 多次被覆盖后丢失 ACContactItem.isGroup 声明，但仍在用 item.isGroup。
          # 此处仅在使用但未声明时自动补上声明与实现，避免重复构建失败。
          if grep -qE 'isGroup[[:space:]]*;' Tweak.xm; then
            echo "isGroup already declared"
          elif grep -q '\.isGroup' Tweak.xm; then
            echo "isGroup used but not declared -> injecting"
            awk '
              {print}
              /^@interface[[:space:]]+ACContactItem[[:space:]]*:/ {print "@property (nonatomic, readonly) BOOL isGroup;"}
              /^@implementation[[:space:]]+ACContactItem[[:space:]]*$/ {print "- (BOOL)isGroup { return self.sourceType == ACContactSourceGroupChat; }"}
            ' Tweak.xm > Tweak.xm.tmp && mv Tweak.xm.tmp Tweak.xm
          else
            echo "isGroup not used"
          fi

      - name: Build dylib
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Package deb
        run: make package FINALPACKAGE=1

      - name: Inspect build output
        if: always()
        run: |
          find .theos/obj -name '*.dylib' -exec file {} \; || true
          ls -l packages/ || true

      - name: Upload dylib
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fj-dylib
          path: .theos/obj/**/*.dylib
          if-no-files-found: warn

      - name: Upload deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fj-deb
          path: packages/*.deb
          if-no-files-found: ignore
